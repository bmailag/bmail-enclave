name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # needed for tag-push releases

jobs:
  reproducibility-check:
    runs-on: ubuntu-latest
    container:
      # Must match the EGo version used by the GitLab CI job that builds
      # the enclave binaries running at bmail.ag. Bump in lockstep.
      image: ghcr.io/edgelesssys/ego-dev:v1.8.1

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Build all five enclaves and assert MRENCLAVE
        run: make all

      - name: Re-collect MRENCLAVE values for release notes
        id: mre
        run: |
          # Regular variants (run on SGX1 hosts: fullxp, Box 1, Box 4).
          # For most enclaves we report the freshly-rebuilt MRENCLAVE
          # because that's what a third party would get by repeating the
          # build — and what the production enclaves are bound to.
          #
          # The keystore is special: production is pinned to the
          # MRENCLAVE recorded in enclave/mrenclaves/keystore.mrenclave
          # because its sealed state is MRENCLAVE-Unique-bound (ADR-008).
          # The freshly-rebuilt MRENCLAVE drifts whenever any transitively-
          # imported source changes. Reporting the pinned value here keeps
          # /verify's "Public release" row in sync with the live keystore.
          for svc in gateway smtp-inbound smtp-outbound payment; do
            mre=$(ego uniqueid build/${svc})
            echo "${svc}_mrenclave=${mre}" >> "$GITHUB_OUTPUT"
            echo "${svc}: ${mre}"
          done
          keystore_pinned=$(tr -d '[:space:]' < enclave/mrenclaves/keystore.mrenclave)
          keystore_built=$(ego uniqueid build/keystore)
          echo "keystore_mrenclave=${keystore_pinned}" >> "$GITHUB_OUTPUT"
          echo "keystore_built_mrenclave=${keystore_built}" >> "$GITHUB_OUTPUT"
          echo "keystore (pinned, in release notes): ${keystore_pinned}"
          echo "keystore (rebuilt from current source): ${keystore_built}"
          # Super variants (gateway + smtp-inbound run on the SGX2
          # super-server in production; same source, larger heap).
          # Output keys use underscores because GITHUB_OUTPUT values
          # follow shell-variable naming.
          for svc in gateway-super smtp-inbound-super; do
            mre=$(ego uniqueid build/${svc})
            key=$(echo "${svc}" | tr - _)_mrenclave
            echo "${key}=${mre}" >> "$GITHUB_OUTPUT"
            echo "${svc}: ${mre}"
          done

      - name: Upload signed enclave artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: enclaves
          path: |
            build/gateway
            build/gateway-super
            build/smtp-inbound
            build/smtp-inbound-super
            build/smtp-outbound
            build/payment
            build/keystore
            enclave/mrenclaves/
          if-no-files-found: error

      - name: Attach to existing release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: |
            build/gateway
            build/gateway-super
            build/smtp-inbound
            build/smtp-inbound-super
            build/smtp-outbound
            build/payment
            build/keystore

      - name: Create release for tag push
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Automated release built by GitHub Actions from tag `${{ github.ref_name }}`.

            **Expected MRENCLAVE values** (verify with `curl https://bmail.ag/.well-known/sgx-quotes/<name>`):

            Regular variants (run on SGX1 hosts: fullxp.net + Box 1 + Box 4):
            ```
            gateway              ${{ steps.mre.outputs.gateway_mrenclave }}
            smtp-inbound         ${{ steps.mre.outputs.smtp-inbound_mrenclave }}
            smtp-outbound        ${{ steps.mre.outputs.smtp-outbound_mrenclave }}
            payment              ${{ steps.mre.outputs.payment_mrenclave }}
            keystore             ${{ steps.mre.outputs.keystore_mrenclave }}  (pinned — see note)
            ```

            **Keystore note**: keystore is pinned to the MRENCLAVE that
            the running production enclave was built against, NOT the
            freshly-rebuilt value (which is
            `${{ steps.mre.outputs.keystore_built_mrenclave }}`). The
            keystore seals its audit log + allowlist + key store under
            MRENCLAVE-Unique, so a new-MRENCLAVE binary cannot unseal
            what the running one wrote. Until the migration tool
            (export/import under attested mTLS) lands, the published
            release notes report the pinned value so verify pages match
            the live attestation. See
            [ADR-008](https://github.com/bmailag/bmail/blob/master/docs/decisions/008-keystore-mrenclave-migration.md).


            Super variants (run on the SGX2 super-server in production
            with a 32 GB enclave heap; same source, larger heap):
            ```
            gateway-super        ${{ steps.mre.outputs.gateway_super_mrenclave }}
            smtp-inbound-super   ${{ steps.mre.outputs.smtp_inbound_super_mrenclave }}
            ```

            These are the byte sequences EGo signs into the enclave
            measurements bmail.ag's services attest to clients.

            To verify locally:

            ```
            git clone https://github.com/bmailag/bmail-enclave.git
            cd bmail-enclave
            docker run --rm -v "$PWD":/src -w /src ghcr.io/edgelesssys/ego-dev:v1.8.1 make all
            ```

            Built with EGo v1.8.1 (linux/amd64).
          files: |
            build/gateway
            build/gateway-super
            build/smtp-inbound
            build/smtp-inbound-super
            build/smtp-outbound
            build/payment
            build/keystore
